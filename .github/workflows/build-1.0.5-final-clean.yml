name: Build final cumulative 1.0.5 installer

on:
  workflow_dispatch:
  push:
    branches: [ medical-family-health-1.0.5 ]
    paths:
      - '.github/workflows/build-1.0.5-final-clean.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble verified 1.0.3 source foundation
        shell: pwsh
        run: |
          $base64 = ''
          foreach ($part in @(
            'bootstrap/source.part01.b64','bootstrap/source.part02.b64','bootstrap/source.part03.b64',
            'bootstrap/source.part04.b64','bootstrap/source.part05.b64','bootstrap/source.part06.b64'
          )) { $base64 += (Get-Content $part -Raw).Trim() }
          $base64 += (Get-Content 'bootstrap/source.part07a.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07b.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07c.b64' -Raw).Trim()
          $part7d = (Get-Content 'bootstrap/source.part07d.b64' -Raw).Trim()
          if ($part7d.Length -lt 4500) { throw 'Phase 3 source part 7d is incomplete.' }
          $base64 += $part7d.Substring(0,4500)
          $base64 += (Get-Content 'bootstrap/source.part08.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('phase3.zip',[Convert]::FromBase64String($base64))
          if ((Get-FileHash phase3.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'eed76fb56a914b1dfba9202053c7f1c3f50a089f1b70f1565157350693ae3cb4') { throw 'Phase 3 verification failed.' }
          Expand-Archive phase3.zip -DestinationPath source -Force
          "SOURCE_ROOT=$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $base64 = ''
          foreach ($part in @(
            'bootstrap/phase5small/chunk-00.b64','bootstrap/phase5small/chunk-01.b64','bootstrap/phase5small/chunk-02.b64',
            'bootstrap/phase5fix/fix-00.b64','bootstrap/phase5fix/fix01-0.b64','bootstrap/phase5fix/fix01-1.b64',
            'bootstrap/phase5fix/fix-02.b64','bootstrap/phase5fix/fix-03.b64','bootstrap/phase5fix/fix04-0.b64',
            'bootstrap/phase5fix/fix04-1.b64','bootstrap/phase5fix/fix-05.b64','bootstrap/phase5fix/pair-06-07.b64',
            'bootstrap/phase5fix/pair-08-09.b64','bootstrap/phase5fix/pair1011-0.b64','bootstrap/phase5fix/pair1011-1.b64',
            'bootstrap/phase5fix/pair1011-2.b64','bootstrap/phase5fix/pair1011-3.b64','bootstrap/phase5fix/pair-12-13.b64',
            'bootstrap/phase5/part05.b64','bootstrap/phase5/part06.b64','bootstrap/phase5/part07.b64'
          )) { $base64 += (Get-Content $part -Raw).Trim() }
          [IO.File]::WriteAllBytes('phase5-1.0.3.zip',[Convert]::FromBase64String($base64))
          if ((Get-FileHash phase5-1.0.3.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '612167ab668886baa94ba614325c9fd758f9330c05a9fc46be70c06389300c59') { throw '1.0.3 verification failed.' }
          Expand-Archive phase5-1.0.3.zip -DestinationPath "$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3" -Force

      - name: Apply verified cumulative 1.0.4 and 1.0.5 packages
        shell: pwsh
        run: |
          $sourceRoot = "$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3"

          $parts104 = @(
            'bootstrap/1.0.4/part00.bin','bootstrap/1.0.4/part01.bin','bootstrap/1.0.4/part02.bin',
            'bootstrap/1.0.4/part03.bin','bootstrap/1.0.4/part04.bin','bootstrap/1.0.4/part05.bin',
            'bootstrap/1.0.4/part06.bin','bootstrap/1.0.4/part07a.bin','bootstrap/1.0.4/part07b.bin',
            'bootstrap/1.0.4/part07c.bin','bootstrap/1.0.4/part07d.bin','bootstrap/1.0.4/part07e.bin','bootstrap/1.0.4/part07f.bin'
          )
          $out = [IO.File]::Create('override104.zip')
          try { foreach ($p in $parts104) { $b=[IO.File]::ReadAllBytes($p); $out.Write($b,0,$b.Length) } } finally { $out.Dispose() }
          $h104=(Get-FileHash override104.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "1.0.4 source SHA256: $h104"
          if ($h104 -ne '4059d9f42af452c0c6271837290b0767e8533290de8939e6833b78744597d586') { throw '1.0.4 verification failed.' }
          Expand-Archive override104.zip -DestinationPath $sourceRoot -Force

          $parts105 = 0..9 | ForEach-Object { "bootstrap/1.0.5/part{0:D2}.bin" -f $_ }
          $out = [IO.File]::Create('override105.zip')
          try { foreach ($p in $parts105) { $b=[IO.File]::ReadAllBytes($p); $out.Write($b,0,$b.Length) } } finally { $out.Dispose() }
          $h105=(Get-FileHash override105.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "1.0.5 source SHA256: $h105"
          if ($h105 -ne '97812fed241307c30c25e86f3eedd585b746298fa747192cf677e8804b3b522d') { throw '1.0.5 verification failed.' }
          Expand-Archive override105.zip -DestinationPath $sourceRoot -Force

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run cumulative tests
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore

      - name: Publish cumulative application
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release -r win-x64 --self-contained true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Web"
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher"

      - name: Download LocalDB prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe' -OutFile "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe"
          $args=@('/Action=Download','/MediaType=LocalDB',"/MediaPath=$env:GITHUB_WORKSPACE\artifacts\sqlmedia",'/Quiet')
          $p=Start-Process -FilePath "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SQL LocalDB download failed: $($p.ExitCode)" }
          $localDb=Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" -Filter SqlLocalDB.msi -Recurse | Select-Object -First 1
          if (-not $localDb) { throw 'SqlLocalDB.msi was not found.' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" | Out-Null
          Copy-Item $localDb.FullName "$env:GITHUB_WORKSPACE\artifacts\payload\SqlLocalDB.msi" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Web\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app" -Recurse -Force

      - name: Force clean WiX 1.0.5 build
        shell: pwsh
        run: |
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\obj" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\obj" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" -o "$env:GITHUB_WORKSPACE\artifacts\msi"
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi" "$env:GITHUB_WORKSPACE\artifacts\payload\LoperFamilyTreeBuilder.msi" -Force
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" -o "$env:GITHUB_WORKSPACE\artifacts\setup"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\final" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\setup\LoperFamilyTreeBuilderSetup.exe" "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe" -Force
          Get-FileHash "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe" -Algorithm SHA256

      - name: Upload final cumulative 1.0.5 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.0.5-final-cumulative
          path: artifacts/final/LoperFamilyTreeBuilderSetup.exe
          if-no-files-found: error
