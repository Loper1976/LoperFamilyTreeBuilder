name: Build Family Data Uploader

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/FamilyDataUploader/**'
      - '.github/workflows/build-family-data-uploader.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single Windows EXE
        shell: pwsh
        run: >-
          dotnet publish tools/FamilyDataUploader/FamilyDataUploader.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o uploader-publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyDataUploader
          path: uploader-publish/LoperFamilyDataUploader.exe
          if-no-files-found: error
          retention-days: 30
