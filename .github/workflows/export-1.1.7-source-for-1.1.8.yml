name: Export reconstructed 1.1.7 source for 1.1.8

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.1.8-ui-cleanup-archive-separation ]
    paths:
      - '.github/workflows/export-1.1.7-source-for-1.1.8.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct verified 1.1.7 source
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.7\build-1.1.7-final.ps1"
          if($LASTEXITCODE-ne0){throw '1.1.7 reconstruction/build failed.'}
      - name: Remove build output
        shell: pwsh
        run: |
          $r="$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3"
          Get-ChildItem $r -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilder-1.1.7-full-source-for-1.1.8
          path: source/LoperFamilyTreeBuilder_InstallerFirst_Phase3/**
          if-no-files-found: error
