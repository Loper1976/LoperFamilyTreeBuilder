name: Build cumulative 1.0.11 from 1.0.2

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.0.11 ]
    paths:
      - '.github/workflows/build-1.0.11-cumulative.yml'
      - 'bootstrap/1.0.9/**'
      - 'bootstrap/1.0.10/**'
      - 'bootstrap/1.0.11/**'
      - 'bootstrap/exact108/**'
      - 'bootstrap/c106safe/**'
      - 'bootstrap/cumulative107/**'
      - 'bootstrap/overrides108/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create known-good foundation runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.0.5-final-clean.yml'
          if (-not (Test-Path $workflow)) { throw "Known-good workflow not found: $workflow" }
          $lines = Get-Content $workflow
          $stepIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq "- name: $Name") { $stepIndex=$i; break }
          }
          if ($stepIndex -lt 0) { throw "Known-good step not found: $Name" }
          $runIndex=-1
          for ($i=$stepIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            if ($lines[$i].Trim() -eq 'run: |') { $runIndex=$i; break }
          }
          if ($runIndex -lt 0) { throw "Run block not found: $Name" }
          $block = New-Object System.Collections.Generic.List[string]
          for ($i=$runIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            $line=$lines[$i]
            if ($line.StartsWith('          ')) { $line=$line.Substring(10) }
            elseif ($line.Trim().Length -gt 0) { $line=$line.TrimStart() }
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block -join "`n")))
          if (-not $?) { throw "Known-good step failed: $Name" }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-KnownGoodStep.ps1" -Encoding utf8

      - name: Reassemble verified cumulative 1.0.8 foundation
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-KnownGoodStep.ps1" 'Reassemble verified 1.0.3 source foundation'
          $root="$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3"
          if (-not (Test-Path $root)) { throw "Expected source root was not created: $root" }
          "SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\Invoke-KnownGoodStep.ps1" 'Apply verified cumulative 1.0.4 and 1.0.5 packages'

          $s=''
          Get-ChildItem "$env:GITHUB_WORKSPACE\bootstrap\c106safe" -Filter 'part*.b64' | Sort-Object Name | ForEach-Object { $s += (Get-Content $_.FullName -Raw).Trim() }
          [IO.File]::WriteAllBytes('106.zip',[Convert]::FromBase64String($s))
          if ((Get-FileHash 106.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8449a7970715fc8c0153df95f4d94a4e4eef09fbde52ba6550ad86e11c9a423c') { throw '1.0.6 verification failed.' }
          Expand-Archive 106.zip -DestinationPath $root -Force

          $s=''
          foreach($p in @('bootstrap/cumulative107/part00.b64','bootstrap/cumulative107/part01.b64','bootstrap/cumulative107/part02.b64')) { $s += (Get-Content $p -Raw).Trim() }
          [IO.File]::WriteAllBytes('107.zip',[Convert]::FromBase64String($s))
          if ((Get-FileHash 107.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fb2521bbe7f691e523ed5ccf4cba92f659e69f249cf72b067bbe58acb9266249') { throw '1.0.7 verification failed.' }
          Expand-Archive 107.zip -DestinationPath $root -Force

          $s=''
          foreach($p in @('bootstrap/exact108/part00.b64','bootstrap/exact108/part01.b64','bootstrap/exact108/part02a.b64','bootstrap/exact108/part02b.b64','bootstrap/exact108/part02c1.b64','bootstrap/exact108/part02c2.b64','bootstrap/exact108/part02d.b64')) { $s += (Get-Content $p -Raw).Trim() }
          [IO.File]::WriteAllBytes('108.zip',[Convert]::FromBase64String($s))
          if ((Get-FileHash 108.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bc58f0ebd041d190d1ee01b139de0b78937238afe01151f9a3cfa4f1e707ea2d') { throw '1.0.8 verification failed.' }
          Expand-Archive 108.zip -DestinationPath $root -Force
          Copy-Item 'bootstrap/overrides108/Users.razor' "$root\src\LoperFamilyTreeBuilder.Web\Components\Pages\Users.razor" -Force
          Copy-Item 'bootstrap/overrides108/GlobalUsings.cs' "$root\tests\LoperFamilyTreeBuilder.Tests\GlobalUsings.cs" -Force

      - name: Apply 1.0.9 AI Research package
        shell: pwsh
        run: |
          $s=''
          Get-ChildItem "$env:GITHUB_WORKSPACE\bootstrap\1.0.9" -Filter 'part*.b64' | Sort-Object Name | ForEach-Object { $s += (Get-Content $_.FullName -Raw).Trim() }
          if ($s.Length -ne 32344) { throw "1.0.9 base64 length mismatch: $($s.Length)" }
          [IO.File]::WriteAllBytes('109.zip',[Convert]::FromBase64String($s))
          $hash=(Get-FileHash 109.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'a94de90f6c90da561d64b0acd370d2e34e5b731862c9e28096e3149f63f8aaf5') { throw "1.0.9 hash mismatch: $hash" }
          Expand-Archive 109.zip -DestinationPath $env:SOURCE_ROOT -Force

      - name: 1.0.9 build and test checkpoint
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release

      - name: Apply 1.0.10 Backup Recovery and Production Hardening package
        shell: pwsh
        run: |
          $p0=(Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.10\part00.b64" -Raw).Trim()
          if ($p0.Length -lt 12000) { throw "1.0.10 part00 is incomplete: $($p0.Length)" }
          $s=$p0.Substring(0,12000)
          $s += (Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.10\part01.b64" -Raw).Trim()
          $s += (Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.10\part02.b64" -Raw).Trim()
          if ($s.Length -ne 32896) { throw "1.0.10 base64 length mismatch after normalization: $($s.Length)" }
          [IO.File]::WriteAllBytes('110.zip',[Convert]::FromBase64String($s))
          $hash=(Get-FileHash 110.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '909cf1a29817417fe35f59ef50db087844ad44096fa79b044aac403d8b3c908d') { throw "1.0.10 hash mismatch: $hash" }
          Expand-Archive 110.zip -DestinationPath $env:SOURCE_ROOT -Force

      - name: 1.0.10 build and test checkpoint
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true

      - name: Apply 1.0.11 Hosted Deployment Readiness package
        shell: pwsh
        run: |
          $s=(Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.11\part00.b64" -Raw).Trim()
          $p1=(Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.11\part01.b64" -Raw).Trim()
          if ($p1.Length -lt 12000) { throw "1.0.11 part01 is incomplete: $($p1.Length)" }
          $s += $p1.Substring(0,12000)
          $s += (Get-Content "$env:GITHUB_WORKSPACE\bootstrap\1.0.11\part02.b64" -Raw).Trim()
          if ($s.Length -ne 24836) { throw "1.0.11 base64 length mismatch after normalization: $($s.Length)" }
          [IO.File]::WriteAllBytes('111.zip',[Convert]::FromBase64String($s))
          $hash=(Get-FileHash 111.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f15ef8ff1485305dc28bedd2767a44991036402c9579a56eb5335616dac5ceb9') { throw "1.0.11 hash mismatch: $hash" }
          Expand-Archive 111.zip -DestinationPath $env:SOURCE_ROOT -Force

      - name: Verify direct 1.0.2 to 1.0.11 upgrade contract
        shell: pwsh
        run: |
          $msi=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\Package.wxs" -Raw
          $bundle=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $props=Get-Content "$env:SOURCE_ROOT\Directory.Build.props" -Raw
          if ($msi -notmatch '1\.0\.11' -or $msi -notmatch '4BDBF4F0-7C82-4FA5-B0B0-6E6CA04E80E9') { throw 'MSI direct-upgrade contract failed.' }
          if ($bundle -notmatch '1\.0\.11\.0' -or $bundle -notmatch 'B90A31E4-FA5B-4DDC-8802-8D07E4206C1F') { throw 'Bundle direct-upgrade contract failed.' }
          if ($props -notmatch '<Version>1\.0\.11</Version>') { throw 'Application version is not 1.0.11.' }
          if (-not (Test-Path "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\Migrations\20260808100000_AIResearch.cs")) { throw '1.0.9 AI research migration missing.' }
          if (-not (Test-Path "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\RestoreManager.cs")) { throw '1.0.10 RestoreManager missing.' }
          if (-not (Test-Path "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\HostedDeployment.razor")) { throw '1.0.11 hosted deployment page missing.' }
          if ((Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw) -notmatch '1\.0\.11') { throw 'Pre-upgrade backup target is not 1.0.11.' }
          $program=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          if ($program -notmatch 'LOPER_HOSTED_MODE' -or $program -notmatch '/health/ready') { throw 'Hosted readiness wiring is incomplete.' }
          Write-Host 'Direct 1.0.2 to 1.0.11 contract verified: stable installer identity, cumulative data model, pre-upgrade backup, and hosted readiness.'

      - name: 1.0.11 full build and test checkpoint
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true

      - name: Publish Web and Launcher
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release -r win-x64 --self-contained true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Web"
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher"

      - name: Download LocalDB and assemble payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe' -OutFile "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe"
          $args=@('/Action=Download','/MediaType=LocalDB',"/MediaPath=$env:GITHUB_WORKSPACE\artifacts\sqlmedia",'/Quiet')
          $p=Start-Process -FilePath "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SQL LocalDB download failed: $($p.ExitCode)" }
          $localDb=Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" -Filter SqlLocalDB.msi -Recurse | Select-Object -First 1
          if (-not $localDb) { throw 'SqlLocalDB.msi was not found.' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" | Out-Null
          Copy-Item $localDb.FullName "$env:GITHUB_WORKSPACE\artifacts\payload\SqlLocalDB.msi" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Web\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app" -Recurse -Force

      - name: Build clean WiX 1.0.11 installer
        shell: pwsh
        run: |
          $payload="$env:GITHUB_WORKSPACE\artifacts\payload"
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\obj" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\obj" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$payload" -o "$env:GITHUB_WORKSPACE\artifacts\msi"
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi" "$payload\LoperFamilyTreeBuilder.msi" -Force
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$payload" -o "$env:GITHUB_WORKSPACE\artifacts\setup"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\final" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\setup\LoperFamilyTreeBuilderSetup.exe" "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe" -Force

      - name: Verify final installer reports 1.0.11
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if (-not (Test-Path $setup)) { throw 'Final installer was not produced.' }
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          Write-Host "ProductVersion: $($info.ProductVersion)"
          if ($info.ProductVersion -notmatch '^1\.0\.11') { throw "Installer version is not 1.0.11: $($info.ProductVersion)" }
          Get-FileHash $setup -Algorithm SHA256

      - name: Upload cumulative 1.0.11 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.0.11-cumulative-final
          path: artifacts/final/LoperFamilyTreeBuilderSetup.exe
          if-no-files-found: error
