name: Build Native Desktop Upgrade Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/integrated-desktop-release
    paths:
      - '.github/workflows/build-native-upgrade-installer.yml'
      - 'bootstrap/overrides/**'
      - 'bootstrap/integrated-overrides/**'

permissions:
  contents: read

concurrency:
  group: native-desktop-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble verified source package
        shell: pwsh
        run: |
          $base64 = ''
          foreach ($part in @(
            'bootstrap/source.part01.b64',
            'bootstrap/source.part02.b64',
            'bootstrap/source.part03.b64',
            'bootstrap/source.part04.b64',
            'bootstrap/source.part05.b64',
            'bootstrap/source.part06.b64'
          )) { $base64 += (Get-Content $part -Raw).Trim() }
          $base64 += (Get-Content 'bootstrap/source.part07a.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07b.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07c.b64' -Raw).Trim()
          $part7d = (Get-Content 'bootstrap/source.part07d.b64' -Raw).Trim()
          if ($part7d.Length -lt 4500) { throw 'Source part 7d is incomplete.' }
          $base64 += $part7d.Substring(0, 4500)
          $base64 += (Get-Content 'bootstrap/source.part08.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('phase3.zip',[Convert]::FromBase64String($base64))
          $expected = 'eed76fb56a914b1dfba9202053c7f1c3f50a089f1b70f1565157350693ae3cb4'
          $actual = (Get-FileHash phase3.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Reassembled source package failed SHA-256 verification.' }
          Expand-Archive phase3.zip -DestinationPath source -Force

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set source root
        shell: pwsh
        run: |
          "SOURCE_ROOT=$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply integrated release overrides
        shell: pwsh
        run: |
          $overrideRoot = "$env:GITHUB_WORKSPACE\bootstrap\integrated-overrides"
          Get-ChildItem $overrideRoot -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($overrideRoot.Length).TrimStart('\')
            $destination = Join-Path $env:SOURCE_ROOT $relative
            New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
            Copy-Item $_.FullName $destination -Force
          }

      - name: Configure WiX 5 and upgrade-safe product identity
        shell: pwsh
        run: |
          $msiProject = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj"
          $setupProject = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj"
          $msiText = (Get-Content $msiProject -Raw).Replace('WixToolset.Sdk/7.0.0','WixToolset.Sdk/5.0.0')
          Set-Content $msiProject $msiText -Encoding utf8
          $setupText = (Get-Content $setupProject -Raw).Replace('WixToolset.Sdk/7.0.0','WixToolset.Sdk/5.0.0').Replace('WixToolset.Bal.wixext" Version="7.0.0','WixToolset.Bal.wixext" Version="5.0.0')
          Set-Content $setupProject $setupText -Encoding utf8

          $packagePath = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\Package.wxs"
          $packageText = Get-Content $packagePath -Raw
          $packageText = [regex]::Replace($packageText,'Version="[0-9]+\.[0-9]+\.[0-9]+"','Version="1.2.0"',1)
          if ($packageText -match 'ProductCode="[^"]+"') {
            $packageText = [regex]::Replace($packageText,'ProductCode="[^"]+"','ProductCode="*"',1)
          }
          if ($packageText -notmatch '<MajorUpgrade\b') {
            $majorUpgrade = '  <MajorUpgrade DowngradeErrorMessage="A newer version of Loper Family Tree Builder is already installed." />' + "`r`n</Package>"
            $packageText = $packageText.Replace('</Package>', $majorUpgrade)
          }
          $packageText = $packageText.Replace('Root="HKMU"','Root="HKCU"')
          Set-Content $packagePath $packageText -Encoding utf8

          $bundlePath = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs"
          $bundleText = Get-Content $bundlePath -Raw
          $bundleText = [regex]::Replace($bundleText,'Version="[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"','Version="1.2.0.0"',1)
          Set-Content $bundlePath $bundleText -Encoding utf8

          Write-Host 'MSI upgrade configuration:'
          Select-String -Path $packagePath -Pattern 'Package|MajorUpgrade|UpgradeCode|ProductCode|Version=' | ForEach-Object { Write-Host $_.Line }
          Write-Host 'Bundle upgrade configuration:'
          Select-String -Path $bundlePath -Pattern 'Bundle|UpgradeCode|Version=' | ForEach-Object { Write-Host $_.Line }

      - name: Apply xUnit compatibility fix
        shell: pwsh
        run: |
          Set-Content -Path "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\GlobalUsings.cs" -Value 'global using Xunit;' -Encoding utf8

      - name: Apply Razor compatibility fixes
        shell: pwsh
        run: |
          $importsPath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\_Imports.razor"
          $importsText = Get-Content $importsPath -Raw
          if ($importsText -notmatch 'RenderMode') { Add-Content -Path $importsPath -Value '@using static Microsoft.AspNetCore.Components.Web.RenderMode' -Encoding utf8 }

          $homePath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\Home.razor"
          $homeText = Get-Content $homePath -Raw
          $homeText = $homeText.Replace('@onclick="() => Navigation.NavigateTo("/people/add")"','@onclick="AddPerson"')
          $homeText = $homeText.Replace('    private void OpenPeopleSearch()',"    private void AddPerson()`r`n    {`r`n        Navigation.NavigateTo(`"/people/add`");`r`n    }`r`n`r`n    private void OpenPeopleSearch()")
          Set-Content $homePath $homeText -Encoding utf8

          $peoplePath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\People.razor"
          $peopleText = Get-Content $peoplePath -Raw
          $peopleText = $peopleText.Replace('@onclick="() => Navigation.NavigateTo("/people/add")"','@onclick="AddPerson"')
          $peopleText = $peopleText.Replace('    private static string FormatDate(DateOnly? date)',"    private void AddPerson()`r`n    {`r`n        Navigation.NavigateTo(`"/people/add`");`r`n    }`r`n`r`n    private static string FormatDate(DateOnly? date)")
          Set-Content $peoplePath $peopleText -Encoding utf8

          $addPath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\AddPerson.razor"
          $addText = Get-Content $addPath -Raw
          $addText = $addText.Replace('@onclick="() => Navigation.NavigateTo("/people")"','@onclick="Cancel"')
          $addText = $addText.Replace('    private CreatePersonRequest ToRequest()',"    private void Cancel()`r`n    {`r`n        Navigation.NavigateTo(`"/people`");`r`n    }`r`n`r`n    private CreatePersonRequest ToRequest()")
          Set-Content $addPath $addText -Encoding utf8

      - name: Run preservation tests
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore

      - name: Publish web reference payload
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release -r win-x64 --self-contained true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Web"

      - name: Publish native WPF desktop application
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher"

      - name: Assemble installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Web\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app" -Recurse -Force

      - name: Download SQL Server LocalDB installation media
        shell: pwsh
        run: |
          $bootstrapper = "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe"
          $url = 'https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe'
          Invoke-WebRequest -Uri $url -OutFile $bootstrapper
          $mediaPath = "$env:GITHUB_WORKSPACE\artifacts\sqlmedia"
          New-Item -ItemType Directory -Force $mediaPath | Out-Null
          $process = Start-Process $bootstrapper -ArgumentList @('/Action=Download','/MediaType=LocalDB',"/MediaPath=$mediaPath",'/Quiet') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "SQL Server LocalDB media download failed with $($process.ExitCode)." }
          $localDb = Get-ChildItem $mediaPath -Filter SqlLocalDB.msi -Recurse | Select-Object -First 1
          if (-not $localDb) { throw 'SqlLocalDB.msi not found.' }
          Copy-Item $localDb.FullName "$env:GITHUB_WORKSPACE\artifacts\payload\SqlLocalDB.msi" -Force

      - name: Build application MSI
        shell: pwsh
        run: |
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj" -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" -o "$env:GITHUB_WORKSPACE\artifacts\msi"
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi" "$env:GITHUB_WORKSPACE\artifacts\payload\LoperFamilyTreeBuilder.msi" -Force

      - name: Validate MSI upgrade metadata
        shell: pwsh
        run: |
          $msi = "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi"
          if (-not (Test-Path $msi)) { throw 'MSI was not produced.' }
          Write-Host "Upgrade-safe MSI produced: $((Get-Item $msi).Length) bytes"

      - name: Build single EXE installer
        shell: pwsh
        run: |
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj" -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" -o "$env:GITHUB_WORKSPACE\artifacts\setup"

      - name: Stage and verify final installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\final" | Out-Null
          $source = "$env:GITHUB_WORKSPACE\artifacts\setup\LoperFamilyTreeBuilderSetup.exe"
          $destination = "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if (-not (Test-Path $source)) { throw 'Single EXE installer was not produced.' }
          Copy-Item $source $destination -Force
          $installer = Get-Item $destination
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $hash = Get-FileHash $destination -Algorithm SHA256
          Write-Host "Installer size: $($installer.Length) bytes"
          Write-Host "Installer SHA256: $($hash.Hash)"

      - name: Upload native upgrade installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-NativeUpgrade-1.2.0
          path: artifacts/final/LoperFamilyTreeBuilderSetup.exe
          if-no-files-found: error
          retention-days: 7
