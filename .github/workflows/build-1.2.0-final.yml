name: Build final cumulative 1.2.0

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.2.0-family-web-preview ]
    paths:
      - '.github/workflows/build-1.2.0-final.yml'
      - 'bootstrap/1.2.0/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create installer step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow=Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.1.4.1-ui-reliability-hotfix.yml'
          if(-not(Test-Path $workflow)){throw "Installer workflow missing: $workflow"}
          $lines=Get-Content $workflow
          $step=-1
          for($i=0;$i-lt$lines.Count;$i++){if($lines[$i].Trim()-eq "- name: $Name"){$step=$i;break}}
          if($step-lt0){throw "Installer step not found: $Name"}
          $run=-1
          for($i=$step+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};if($lines[$i].Trim()-eq 'run: |'){$run=$i;break}}
          if($run-lt0){throw "Run block not found: $Name"}
          $block=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i-lt$lines.Count;$i++){
            if($lines[$i]-match '^      - '){break}
            $line=$lines[$i]
            if($line.StartsWith('          ')){$line=$line.Substring(10)}elseif($line.Trim().Length-gt0){$line=$line.TrimStart()}
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block-join "`n")))
          if(-not $?){throw "Installer step failed: $Name"}
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" -Encoding utf8

      - name: Reconstruct verified cumulative 1.1.9
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.8\build-1.1.8-final.ps1"
          $env:SOURCE_ROOT=Join-Path $env:GITHUB_WORKSPACE 'source\LoperFamilyTreeBuilder_InstallerFirst_Phase3'
          if(-not(Test-Path $env:SOURCE_ROOT)){throw "1.1.8 source missing: $env:SOURCE_ROOT"}
          "SOURCE_ROOT=$env:SOURCE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.9\apply-1.1.9.ps1" -Root $env:SOURCE_ROOT
          Write-Host 'Verified cumulative 1.1.9 source reconstructed.'

      - name: Apply 1.2.0 family web preview
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.0\apply-1.2.0.ps1" -Root $env:SOURCE_ROOT

      - name: Verify cumulative 1.2.0 contract
        shell: pwsh
        run: |
          $r=$env:SOURCE_ROOT
          $props=Get-Content "$r\Directory.Build.props" -Raw
          $launcher=Get-Content "$r\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $program=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          $policy=Get-Content "$r\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $layout=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Layout\PublicLayout.razor" -Raw
          $directory=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\PublicDirectory.razor" -Raw
          $profile=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\PublicPersonProfile.razor" -Raw
          $preview=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\PublicPreview.razor" -Raw
          $profiles=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\PublicProfiles.razor" -Raw
          $nav=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Layout\NavMenu.razor" -Raw
          $production=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\ProductionRelease.razor" -Raw
          $css=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\wwwroot\app.css" -Raw
          $bundle=Get-Content "$r\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $msi=Get-Content "$r\installer\LoperFamilyTreeBuilder.Msi\Package.wxs" -Raw

          if($props-notmatch'<Version>1\.2\.0</Version>'-or$props-notmatch'<FileVersion>1\.2\.0\.0</FileVersion>'){throw '1.2.0 version metadata missing.'}
          if($launcher-notmatch'TargetVersion = "1\.2\.0"'){throw '1.2.0 pre-upgrade backup target missing.'}
          if($program-notmatch'version = "1\.2\.0"'-or$program-notmatch'release = "family-web-preview"'){throw '1.2.0 host markers missing.'}
          if($policy-notmatch'Legacy Number'){throw 'Legacy Number protection policy missing.'}
          if($layout-notmatch'Local Public Preview' -or $layout-notmatch'Nothing is being published to loper.family'){throw 'Local preview safety banner missing.'}
          if($directory-notmatch'LOPER.FAMILY PREVIEW' -or $directory-notmatch'Private records stay private'){throw 'Public directory experience missing.'}
          if($profile-notmatch'Public view generated from approved archive records' -or $profile-notmatch'public-profile-header-120'){throw 'Public profile experience missing.'}
          if($preview-notmatch'@page "/public-preview"' -or $preview-notmatch'Authorize\(Policy = "ArchiveAdmin"\)' -or $preview-notmatch'Deployment remains blocked by owner approval'){throw 'Safe public preview center missing.'}
          if($profiles-notmatch'Preview Center' -or $profiles-notmatch'Open Public View'){throw 'Public profile administration preview links missing.'}
          if($nav-notmatch'href="/public-preview"'){throw 'Public Preview navigation link missing.'}
          if($production-notmatch'version 1\.2\.0' -or $production-notmatch'Owner approval is still required before any deployment'){throw 'Production release deployment gate missing.'}
          if($css-notmatch'1\.2\.0 - family web experience and safe public preview'){throw '1.2.0 public styling missing.'}
          if($bundle-notmatch'Version="1\.2\.0\.0"'){throw 'Bundle version is not 1.2.0.0.'}
          if($msi-notmatch'Version="1\.2\.0"'){throw 'MSI version is not 1.2.0.'}
          foreach($f in @('tests/LoperFamilyTreeBuilder.Tests/FamilyWebPreviewTests.cs','src/LoperFamilyTreeBuilder.Web/Components/Pages/FamilyHealthPatterns.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/ArchiveMediaDetails.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/FamilyTree.razor')){if(-not(Test-Path(Join-Path $r $f))){throw "Required cumulative file missing: $f"}}
          $pages=Join-Path $r 'src/LoperFamilyTreeBuilder.Web/Components/Pages';$owners=@{}
          Get-ChildItem $pages -Filter '*.razor' -File -Recurse | ForEach-Object {$t=Get-Content $_.FullName -Raw;foreach($m in [regex]::Matches($t,'(?m)^@page\s+"([^"]+)"')){$route=$m.Groups[1].Value;if(-not $owners.ContainsKey($route)){$owners[$route]=@()};$owners[$route]+=$_.Name}}
          $dups=@($owners.GetEnumerator()|Where-Object{@($_.Value).Count-gt1});if($dups.Count-gt0){throw 'Duplicate Razor routes detected.'}
          foreach($route in @('/','/archive','/photos','/documents','/family','/family/{Slug}','/public-preview','/public-profiles','/family-tree','/family-health-patterns','/research-intelligence')){if(-not $owners.ContainsKey($route)){throw "Primary route missing: $route"}}
          Write-Host '1.2.0 contract verified.'

      - name: Test and build cumulative 1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          if($LASTEXITCODE-ne0){throw 'Restore failed.'}
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'Tests failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          if($LASTEXITCODE-ne0){throw 'Web build failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true
          if($LASTEXITCODE-ne0){throw 'Launcher build failed.'}

      - name: Publish 1.2.0 applications
        shell: pwsh
        run: |
          if(Test-Path "$env:GITHUB_WORKSPACE\artifacts"){Remove-Item "$env:GITHUB_WORKSPACE\artifacts" -Recurse -Force}
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Publish applications fail-fast'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Assemble Windows installer payload'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Build WiX 1.1.4.1 installer fail-fast'

      - name: Create verified 1.2.0 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if(-not(Test-Path $setup)){throw 'Final 1.2.0 installer missing.'}
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if($info.ProductVersion-notmatch'^1\.2\.0'){throw "Incorrect ProductVersion: $($info.ProductVersion)"}
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig=Get-AuthenticodeSignature $setup
          [ordered]@{
            application='Loper Family Tree Builder';version='1.2.0';release='Family Web Experience & Public Preview';sha256=$hash;authenticodeStatus=$sig.Status.ToString();directUpgradeBaseline='1.0.2';upgradeFrom119Verified=$true;legacyNumberPreservationVerified=$true;localPreviewOnlyVerified=$true;deploymentBlockedWithoutOwnerApproval=$true;publicDirectoryPolishVerified=$true;publicProfilePolishVerified=$true;livingPersonProtectionPreserved=$true;publicMediaPrivacyPreserved=$true;safePreviewCenterVerified=$true;archiveDetailEnhancementsPreserved=$true;collapsibleNavigationPreserved=$true;familyHealthPatternsPreserved=$true;researchIntelligencePreserved=$true;interactiveTreePreserved=$true;trustedSigningDeferred=$true;cumulativeTestsPassed=$true;githubRunId=$env:GITHUB_RUN_ID;generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.2.0.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode: $($sig.Status)"

      - name: Upload verified 1.2.0 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.2.0-family-web-preview
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.2.0.json
          if-no-files-found: error
