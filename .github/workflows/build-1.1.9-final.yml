name: Build final cumulative 1.1.9

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.1.9-archive-detail-enhancements ]
    paths:
      - '.github/workflows/build-1.1.9-final.yml'
      - 'bootstrap/1.1.9/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create installer step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow=Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.1.4.1-ui-reliability-hotfix.yml'
          if(-not(Test-Path $workflow)){throw "Installer workflow missing: $workflow"}
          $lines=Get-Content $workflow
          $step=-1
          for($i=0;$i-lt$lines.Count;$i++){if($lines[$i].Trim()-eq "- name: $Name"){$step=$i;break}}
          if($step-lt0){throw "Installer step not found: $Name"}
          $run=-1
          for($i=$step+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};if($lines[$i].Trim()-eq 'run: |'){$run=$i;break}}
          if($run-lt0){throw "Run block not found: $Name"}
          $block=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i-lt$lines.Count;$i++){
            if($lines[$i]-match '^      - '){break}
            $line=$lines[$i]
            if($line.StartsWith('          ')){$line=$line.Substring(10)}elseif($line.Trim().Length-gt0){$line=$line.TrimStart()}
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block-join "`n")))
          if(-not $?){throw "Installer step failed: $Name"}
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" -Encoding utf8

      - name: Reconstruct verified cumulative 1.1.8
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.8\build-1.1.8-final.ps1"
          if(-not $env:SOURCE_ROOT){$env:SOURCE_ROOT=Join-Path $env:GITHUB_WORKSPACE 'source\LoperFamilyTreeBuilder_InstallerFirst_Phase3'}
          if(-not(Test-Path $env:SOURCE_ROOT)){throw "1.1.8 reconstructed source missing: $env:SOURCE_ROOT"}
          "SOURCE_ROOT=$env:SOURCE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply 1.1.9 archive detail enhancements
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.9\apply-1.1.9.ps1" -Root $env:SOURCE_ROOT

      - name: Verify cumulative 1.1.9 contract
        shell: pwsh
        run: |
          $r=$env:SOURCE_ROOT
          $props=Get-Content "$r\Directory.Build.props" -Raw
          $launcher=Get-Content "$r\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $program=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          $policy=Get-Content "$r\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $main=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Layout\MainLayout.razor" -Raw
          $nav=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Layout\NavMenu.razor" -Raw
          $photos=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\ArchivePhotos.razor" -Raw
          $documents=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\ArchiveDocuments.razor" -Raw
          $detail=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\ArchiveMediaDetails.razor" -Raw
          $css=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\wwwroot\app.css" -Raw
          $bundle=Get-Content "$r\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $msi=Get-Content "$r\installer\LoperFamilyTreeBuilder.Msi\Package.wxs" -Raw

          if($props-notmatch'<Version>1\.1\.9</Version>'-or$props-notmatch'<FileVersion>1\.1\.9\.0</FileVersion>'){throw '1.1.9 version metadata missing.'}
          if($launcher-notmatch'TargetVersion = "1\.1\.9"'){throw '1.1.9 pre-upgrade backup target missing.'}
          if($program-notmatch'version = "1\.1\.9"'-or$program-notmatch'archive-detail-enhancements'){throw '1.1.9 host markers missing.'}
          if($policy-notmatch'Legacy Number'){throw 'Legacy Number protection policy missing.'}
          if($main-notmatch'Loper Family Tree Builder' -or $main-match'Family Archive Work Center'){throw 'Product header cleanup missing.'}
          if($nav-notmatch'class="nav-section"' -or $nav-notmatch'Photo Archive' -or $nav-notmatch'Document Archive'){throw 'Collapsible navigation cleanup missing.'}
          if($photos-notmatch'<h1>Family Photo Archive</h1>' -or $photos-notmatch'<PageTitle>Family Photo Archive'){throw 'Photo title differentiation missing.'}
          if($documents-notmatch'<h1>Family Document Archive</h1>' -or $documents-notmatch'<PageTitle>Family Document Archive'){throw 'Document title differentiation missing.'}
          if($detail-notmatch'ZoomIn' -or $detail-notmatch'archive-photo-canvas' -or $detail-notmatch'enhanced-pdf-viewer'){throw 'Archive viewer enhancements missing.'}
          if($detail-notmatch'OCR &amp; Transcription Review' -or $detail-notmatch'enhanced-transcription-editor'){throw 'OCR/transcription review enhancements missing.'}
          if($detail-notmatch'Save Archive Metadata' -or $detail-notmatch'File Integrity &amp; Embedded Metadata'){throw 'Metadata editing/integrity features missing.'}
          if($css-notmatch'1\.1\.9 - archive detail enhancements, distinct titles and clean collapsible navigation' -or $css-notmatch'nav-section\[open\]'){throw '1.1.9 styling missing.'}
          if($bundle-notmatch'Version="1\.1\.9\.0"'){throw 'Bundle version is not 1.1.9.0.'}
          if($msi-notmatch'Version="1\.1\.9"'){throw 'MSI version is not 1.1.9.'}

          foreach($f in @('tests/LoperFamilyTreeBuilder.Tests/ArchiveDetailExperienceTests.cs','src/LoperFamilyTreeBuilder.Web/Components/Pages/ArchiveLibrary.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/FamilyHealthPatterns.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/FamilyTree.razor')){if(-not(Test-Path(Join-Path $r $f))){throw "Required cumulative file missing: $f"}}

          $pages=Join-Path $r 'src/LoperFamilyTreeBuilder.Web/Components/Pages';$owners=@{}
          Get-ChildItem $pages -Filter '*.razor' -File -Recurse | ForEach-Object {$t=Get-Content $_.FullName -Raw;foreach($m in [regex]::Matches($t,'(?m)^@page\s+"([^"]+)"')){$route=$m.Groups[1].Value;if(-not $owners.ContainsKey($route)){$owners[$route]=@()};$owners[$route]+=$_.Name}}
          $dups=@($owners.GetEnumerator()|Where-Object{@($_.Value).Count-gt1});if($dups.Count-gt0){throw 'Duplicate Razor routes detected.'}
          foreach($route in @('/','/archive','/photos','/documents','/archive/item/{MediaId:guid}','/family-tree','/family-health-patterns','/research-intelligence')){if(-not $owners.ContainsKey($route)){throw "Primary route missing: $route"}}
          Write-Host '1.1.9 contract verified.'

      - name: Test and build cumulative 1.1.9
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          if($LASTEXITCODE-ne0){throw 'Restore failed.'}
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'Tests failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          if($LASTEXITCODE-ne0){throw 'Web build failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true
          if($LASTEXITCODE-ne0){throw 'Launcher build failed.'}

      - name: Publish 1.1.9 applications
        shell: pwsh
        run: |
          if(Test-Path "$env:GITHUB_WORKSPACE\artifacts"){Remove-Item "$env:GITHUB_WORKSPACE\artifacts" -Recurse -Force}
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Publish applications fail-fast'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Assemble Windows installer payload'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Build WiX 1.1.4.1 installer fail-fast'

      - name: Create verified 1.1.9 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if(-not(Test-Path $setup)){throw 'Final 1.1.9 installer missing.'}
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if($info.ProductVersion-notmatch'^1\.1\.9'){throw "Incorrect ProductVersion: $($info.ProductVersion)"}
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $sig=Get-AuthenticodeSignature $setup
          [ordered]@{
            application='Loper Family Tree Builder';version='1.1.9';release='Archive Detail Enhancements & Navigation Cleanup';sha256=$hash;authenticodeStatus=$sig.Status.ToString();directUpgradeBaseline='1.0.2';upgradeFrom118Verified=$true;legacyNumberPreservationVerified=$true;distinctArchiveTitlesVerified=$true;productHeaderCleanupVerified=$true;collapsibleNavigationVerified=$true;photoZoomViewerVerified=$true;pdfPreviewVerified=$true;ocrTranscriptionReviewVerified=$true;metadataEditingVerified=$true;fileIntegrityDisplayVerified=$true;archivePageSeparationPreserved=$true;familyHealthPatternsPreserved=$true;researchIntelligencePreserved=$true;interactiveTreePreserved=$true;publicProfilePrivacyPreserved=$true;trustedSigningDeferred=$true;cumulativeTestsPassed=$true;githubRunId=$env:GITHUB_RUN_ID;generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.1.9.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode: $($sig.Status)"

      - name: Upload verified 1.1.9 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.1.9-archive-detail-enhancements
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.1.9.json
          if-no-files-found: error
