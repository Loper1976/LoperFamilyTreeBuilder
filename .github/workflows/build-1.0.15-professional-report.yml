name: Build cumulative 1.0.15 professional detailed person report

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.0.15-professional-report ]
    paths:
      - '.github/workflows/build-1.0.15-professional-report.yml'
      - 'bootstrap/1.0.15/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create 1.0.14 step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.0.14-modern-profile.yml'
          $lines = Get-Content $workflow
          $stepIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) { if ($lines[$i].Trim() -eq "- name: $Name") { $stepIndex=$i; break } }
          if ($stepIndex -lt 0) { throw "1.0.14 step not found: $Name" }
          $runIndex=-1
          for ($i=$stepIndex+1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^      - ') { break }; if ($lines[$i].Trim() -eq 'run: |') { $runIndex=$i; break } }
          if ($runIndex -lt 0) { throw "Run block not found: $Name" }
          $block = New-Object System.Collections.Generic.List[string]
          for ($i=$runIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            $line=$lines[$i]
            if ($line.StartsWith('          ')) { $line=$line.Substring(10) } elseif ($line.Trim().Length -gt 0) { $line=$line.TrimStart() }
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block -join "`n")))
          if (-not $?) { throw "1.0.14 step failed: $Name" }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" -Encoding utf8

      - name: Create foundation helpers
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Create previous-release step runner'
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Create foundation helper'

      - name: Reconstruct cumulative 1.0.11
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Reconstruct cumulative 1.0.11'

      - name: Apply cumulative 1.0.12
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Apply cumulative 1.0.12'

      - name: Apply production 1.0.13
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Apply production 1.0.13'

      - name: Apply modern person profile 1.0.14
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-114Step.ps1" 'Apply modern person profile 1.0.14'

      - name: Apply professional detailed person report 1.0.15
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.0.15\apply-1.0.15.ps1" -Root $env:SOURCE_ROOT

      - name: Verify direct 1.0.2 to 1.0.15 contract
        shell: pwsh
        run: |
          $msi=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\Package.wxs" -Raw
          $bundle=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $props=Get-Content "$env:SOURCE_ROOT\Directory.Build.props" -Raw
          $launcher=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $policy=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $services=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\ServiceCollectionExtensions.cs" -Raw
          $profile=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\PersonDetails.razor" -Raw
          $reportService=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\Services\DetailedPersonReportService.cs" -Raw
          if ($msi -notmatch '1\.0\.15' -or $msi -notmatch '4BDBF4F0-7C82-4FA5-B0B0-6E6CA04E80E9') { throw 'MSI upgrade identity failed.' }
          if ($bundle -notmatch '1\.0\.15\.0' -or $bundle -notmatch 'B90A31E4-FA5B-4DDC-8802-8D07E4206C1F') { throw 'Bundle upgrade identity failed.' }
          if ($props -notmatch '<Version>1\.0\.15</Version>') { throw 'Application version is not 1.0.15.' }
          if ($launcher -notmatch 'TargetVersion = "1\.0\.15"') { throw 'Pre-upgrade backup target failed.' }
          if ($policy -notmatch 'Legacy Number') { throw 'Legacy Number preservation policy missing.' }
          if ($services -notmatch 'DetailedPersonReportService') { throw 'Detailed report service is not registered.' }
          if ($profile -notmatch '/detailed-report') { throw 'Person Profile detailed report action is missing.' }
          if ($reportService -notmatch 'history\.IsLiving' -or $reportService -notmatch 'AuthorizedFamily' -or $reportService -notmatch 'PublicSafe') { throw 'Medical report privacy contract is incomplete.' }
          foreach($required in @(
            'src/LoperFamilyTreeBuilder.Core/Models/DetailedPersonReportModels.cs',
            'src/LoperFamilyTreeBuilder.Data/Services/DetailedPersonReportService.cs',
            'src/LoperFamilyTreeBuilder.Web/Components/Pages/DetailedPersonReport.razor',
            'src/LoperFamilyTreeBuilder.Web/Components/Pages/DetailedPersonReport.razor.css',
            'tests/LoperFamilyTreeBuilder.Tests/DetailedPersonReportTests.cs'
          )) { if (-not (Test-Path (Join-Path $env:SOURCE_ROOT $required))) { throw "Required 1.0.15 file missing: $required" } }
          Write-Host '1.0.2 -> 1.0.15 cumulative upgrade, report, medical privacy, and preservation contract verified.'

      - name: Test and build fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"; if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore; if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release; if ($LASTEXITCODE -ne 0) { throw 'Web build failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true; if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }

      - name: Publish applications fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release -r win-x64 --self-contained true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Web"; if ($LASTEXITCODE -ne 0) { throw 'Web publish failed.' }
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -r win-x64 --self-contained true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher"; if ($LASTEXITCODE -ne 0) { throw 'Launcher publish failed.' }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\artifacts\publish\Web\LoperFamilyTreeBuilder.Web.exe")) { throw 'Web EXE missing.' }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\LoperFamilyTreeBuilder.Launcher.exe")) { throw 'Launcher EXE missing.' }

      - name: Assemble Windows installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe' -OutFile "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe"
          $args=@('/Action=Download','/MediaType=LocalDB',"/MediaPath=$env:GITHUB_WORKSPACE\artifacts\sqlmedia",'/Quiet')
          $p=Start-Process -FilePath "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LocalDB download failed: $($p.ExitCode)" }
          $localDb=Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts\sqlmedia" -Filter SqlLocalDB.msi -Recurse | Select-Object -First 1
          if (-not $localDb) { throw 'SqlLocalDB.msi missing.' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" | Out-Null
          Copy-Item $localDb.FullName "$env:GITHUB_WORKSPACE\artifacts\payload\SqlLocalDB.msi" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Web\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app" -Recurse -Force

      - name: Build WiX 1.0.15 installer fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $payload="$env:GITHUB_WORKSPACE\artifacts\payload"
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\obj" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\obj" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$payload" -o "$env:GITHUB_WORKSPACE\artifacts\msi"; if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi" "$payload\LoperFamilyTreeBuilder.msi" -Force
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj" -t:Rebuild -c Release -p:InstallerPlatform=x64 -p:PayloadDir="$payload" -o "$env:GITHUB_WORKSPACE\artifacts\setup"; if ($LASTEXITCODE -ne 0) { throw 'Bundle build failed.' }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\final" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\setup\LoperFamilyTreeBuilderSetup.exe" "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe" -Force

      - name: Create verified 1.0.15 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if ($info.ProductVersion -notmatch '^1\.0\.15') { throw "Incorrect ProductVersion: $($info.ProductVersion)" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature=Get-AuthenticodeSignature $setup
          [ordered]@{application='Loper Family Tree Builder';version='1.0.15';release='Professional Detailed Person Report';sha256=$hash;authenticodeStatus=$signature.Status.ToString();directUpgradeBaseline='1.0.2';legacyNumberPreservationVerified=$true;deceasedMedicalPrivacyVerified=$true;cumulativeTestsPassed=$true;githubRunId=$env:GITHUB_RUN_ID;generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')} | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.0.15.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode: $($signature.Status)"

      - name: Upload verified 1.0.15 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.0.15-professional-report-final
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.0.15.json
          if-no-files-found: error
