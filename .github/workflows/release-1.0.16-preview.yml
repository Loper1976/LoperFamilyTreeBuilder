name: Publish 1.0.16 preview installer

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.0.16-research-intelligence ]
    paths:
      - '.github/workflows/release-1.0.16-preview.yml'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for verified 1.0.16 build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow build-1.0.16-research-intelligence.yml --branch cumulative-1.0.16-research-intelligence --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then break; fi
            echo "Waiting for verified 1.0.16 build... ($i/60)"
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then echo 'No successful verified 1.0.16 build found.'; exit 1; fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Download verified installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release
          gh run download "$RUN_ID" --name LoperFamilyTreeBuilderSetup-1.0.16-research-intelligence-final --dir release
          test -f release/LoperFamilyTreeBuilderSetup.exe
          test -f release/release-manifest-1.0.16.json
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v1.0.16-preview --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create v1.0.16-preview \
            release/LoperFamilyTreeBuilderSetup.exe \
            release/release-manifest-1.0.16.json \
            --target cumulative-1.0.16-research-intelligence \
            --title 'Loper Family Tree Builder 1.0.16 - Research Intelligence & Global Archive Search' \
            --notes 'Verified cumulative preview build. Includes the 1.0.15 professional detailed person report plus global archive search, advanced person search, saved searches, proof workspaces, repository search history, aliases, data-quality analysis, and advanced research planning. AI remains proposal-first. Installer remains unsigned until publisher identity/code signing is completed.' \
            --prerelease
