name: Build cumulative 1.0.16 research intelligence

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.0.16-research-intelligence-final ]
    paths:
      - '.github/workflows/build-1.0.16-research-intelligence.yml'
      - 'bootstrap/1.0.16/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create 1.0.15 step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.0.15-professional-report.yml'
          if (-not (Test-Path $workflow)) { throw "1.0.15 workflow not found: $workflow" }
          $lines = Get-Content $workflow
          $stepIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq "- name: $Name") { $stepIndex=$i; break }
          }
          if ($stepIndex -lt 0) { throw "1.0.15 step not found: $Name" }
          $runIndex=-1
          for ($i=$stepIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            if ($lines[$i].Trim() -eq 'run: |') { $runIndex=$i; break }
          }
          if ($runIndex -lt 0) { throw "Run block not found: $Name" }
          $block = New-Object System.Collections.Generic.List[string]
          for ($i=$runIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            $line=$lines[$i]
            if ($line.StartsWith('          ')) { $line=$line.Substring(10) }
            elseif ($line.Trim().Length -gt 0) { $line=$line.TrimStart() }
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block -join "`n")))
          if (-not $?) { throw "1.0.15 step failed: $Name" }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" -Encoding utf8

      - name: Create foundation helpers
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Create 1.0.14 step runner'
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Create foundation helpers'

      - name: Reconstruct cumulative 1.0.11
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Reconstruct cumulative 1.0.11'

      - name: Apply cumulative 1.0.12
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Apply cumulative 1.0.12'

      - name: Apply production 1.0.13
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Apply production 1.0.13'

      - name: Apply modern person profile 1.0.14
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Apply modern person profile 1.0.14'

      - name: Apply professional detailed person report 1.0.15
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Apply professional detailed person report 1.0.15'

      - name: Apply research intelligence 1.0.16
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.0.16\apply-1.0.16.ps1" -Root $env:SOURCE_ROOT

      - name: Verify direct 1.0.2 to 1.0.16 contract
        shell: pwsh
        run: |
          $msi=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\Package.wxs" -Raw
          $bundle=Get-Content "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $props=Get-Content "$env:SOURCE_ROOT\Directory.Build.props" -Raw
          $launcher=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $policy=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $db=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\FamilyTreeDbContext.cs" -Raw
          $service=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\Services\ResearchIntelligenceService.cs" -Raw
          $global=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\GlobalSearch.razor" -Raw
          $research=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\ResearchIntelligence.razor" -Raw
          if ($msi -notmatch '1\.0\.16' -or $msi -notmatch '4BDBF4F0-7C82-4FA5-B0B0-6E6CA04E80E9') { throw 'MSI upgrade identity failed.' }
          if ($bundle -notmatch '1\.0\.16\.0' -or $bundle -notmatch 'B90A31E4-FA5B-4DDC-8802-8D07E4206C1F') { throw 'Bundle upgrade identity failed.' }
          if ($props -notmatch '<Version>1\.0\.16</Version>') { throw 'Application version is not 1.0.16.' }
          if ($launcher -notmatch 'TargetVersion = "1\.0\.16"') { throw 'Pre-upgrade backup target failed.' }
          if ($policy -notmatch 'Legacy Number') { throw 'Legacy Number preservation policy missing.' }
          if ($db -notmatch 'PersonAliases' -or $db -notmatch 'ResearchProofCases' -or $db -notmatch 'RepositorySearchLogs') { throw 'Research Intelligence DbSets are incomplete.' }
          if ($service -notmatch 'GlobalSearchAsync' -or $service -notmatch 'GetDataQualityAsync') { throw 'Research Intelligence service contract incomplete.' }
          if ($global -notmatch '@page "/global-search"' -or $research -notmatch '@page "/research-intelligence"') { throw 'Research Intelligence pages are incomplete.' }
          foreach($required in @(
            'src/LoperFamilyTreeBuilder.Data/Migrations/20260809110000_ResearchIntelligence.cs',
            'tests/LoperFamilyTreeBuilder.Tests/ResearchIntelligenceTests.cs',
            'src/LoperFamilyTreeBuilder.Web/Components/Pages/DetailedPersonReport.razor'
          )) { if (-not (Test-Path (Join-Path $env:SOURCE_ROOT $required))) { throw "Required cumulative file missing: $required" } }
          Write-Host '1.0.2 -> 1.0.16 cumulative upgrade, research intelligence, detailed report, medical privacy, and Legacy Number preservation contract verified.'

      - name: Test and build fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"; if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore; if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release; if ($LASTEXITCODE -ne 0) { throw 'Web build failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true; if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }

      - name: Publish applications fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Publish applications fail-fast'

      - name: Assemble Windows installer payload
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Assemble Windows installer payload'

      - name: Build WiX 1.0.16 installer fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-115Step.ps1" 'Build WiX 1.0.15 installer fail-fast'

      - name: Create verified 1.0.16 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if (-not (Test-Path $setup)) { throw 'Final 1.0.16 installer missing.' }
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if ($info.ProductVersion -notmatch '^1\.0\.16') { throw "Incorrect ProductVersion: $($info.ProductVersion)" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature=Get-AuthenticodeSignature $setup
          [ordered]@{
            application='Loper Family Tree Builder'
            version='1.0.16'
            release='Research Intelligence & Global Archive Search'
            sha256=$hash
            authenticodeStatus=$signature.Status.ToString()
            directUpgradeBaseline='1.0.2'
            legacyNumberPreservationVerified=$true
            detailedPersonReportPreserved=$true
            deceasedMedicalPrivacyVerified=$true
            researchProposalFirst=$true
            cumulativeTestsPassed=$true
            githubRunId=$env:GITHUB_RUN_ID
            generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.0.16.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode: $($signature.Status)"

      - name: Upload verified 1.0.16 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.0.16-research-intelligence-final
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.0.16.json
          if-no-files-found: error
