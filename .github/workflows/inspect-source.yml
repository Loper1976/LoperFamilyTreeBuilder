name: Inspect Integrated Source

on:
  push:
    branches:
      - agent/integrated-desktop-release
    paths:
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble exact Phase 3 source package
        shell: pwsh
        run: |
          $base64 = ''
          foreach ($part in @(
            'bootstrap/source.part01.b64',
            'bootstrap/source.part02.b64',
            'bootstrap/source.part03.b64',
            'bootstrap/source.part04.b64',
            'bootstrap/source.part05.b64',
            'bootstrap/source.part06.b64'
          )) {
            $base64 += (Get-Content $part -Raw).Trim()
          }
          $base64 += (Get-Content 'bootstrap/source.part07a.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07b.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07c.b64' -Raw).Trim()
          $part7d = (Get-Content 'bootstrap/source.part07d.b64' -Raw).Trim()
          $base64 += $part7d.Substring(0, 4500)
          $base64 += (Get-Content 'bootstrap/source.part08.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('phase3.zip', [Convert]::FromBase64String($base64))
          $expected = 'eed76fb56a914b1dfba9202053c7f1c3f50a089f1b70f1565157350693ae3cb4'
          $actual = (Get-FileHash phase3.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Source package verification failed.' }
          Expand-Archive phase3.zip -DestinationPath source -Force

      - name: Emit source manifest
        shell: pwsh
        run: |
          $root = Resolve-Path 'source/LoperFamilyTreeBuilder_InstallerFirst_Phase3'
          Write-Host '--- PROJECTS ---'
          Get-ChildItem $root -Recurse -File -Include *.sln,*.csproj,*.wixproj | ForEach-Object {
            Write-Host $_.FullName.Substring($root.Path.Length + 1)
          }
          Write-Host '--- CSHARP AND RAZOR ---'
          Get-ChildItem $root -Recurse -File -Include *.cs,*.razor | ForEach-Object {
            Write-Host $_.FullName.Substring($root.Path.Length + 1)
          }

      - name: Upload reconstructed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-source-snapshot
          path: source/LoperFamilyTreeBuilder_InstallerFirst_Phase3
          retention-days: 1
          if-no-files-found: error
