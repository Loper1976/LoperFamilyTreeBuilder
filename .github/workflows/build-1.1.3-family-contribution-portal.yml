name: Build cumulative 1.1.3 family contribution portal

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.1.3-family-contribution-portal ]
    paths:
      - '.github/workflows/build-1.1.3-family-contribution-portal.yml'
      - 'bootstrap/1.1.3/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create 1.1.2 step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.1.2-family-accounts-permissions.yml'
          if (-not (Test-Path $workflow)) { throw "1.1.2 workflow not found: $workflow" }
          $lines = Get-Content $workflow
          $stepIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq "- name: $Name") { $stepIndex=$i; break }
          }
          if ($stepIndex -lt 0) { throw "1.1.2 step not found: $Name" }
          $runIndex=-1
          for ($i=$stepIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            if ($lines[$i].Trim() -eq 'run: |') { $runIndex=$i; break }
          }
          if ($runIndex -lt 0) { throw "Run block not found: $Name" }
          $block = New-Object System.Collections.Generic.List[string]
          for ($i=$runIndex+1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^      - ') { break }
            $line=$lines[$i]
            if ($line.StartsWith('          ')) { $line=$line.Substring(10) }
            elseif ($line.Trim().Length -gt 0) { $line=$line.TrimStart() }
            $block.Add($line)
          }
          & ([ScriptBlock]::Create(($block -join "`n")))
          if (-not $?) { throw "1.1.2 step failed: $Name" }
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" -Encoding utf8

      - name: Create 1.1.1 step runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Create 1.1.1 step runner'

      - name: Create 1.1.0 step runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Create 1.1.0 step runner'

      - name: Create 1.0.16 step runner
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Create 1.0.16 step runner'

      - name: Create foundation helpers
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Create foundation helpers'

      - name: Reconstruct cumulative 1.0.11
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Reconstruct cumulative 1.0.11'

      - name: Apply cumulative 1.0.12
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply cumulative 1.0.12'

      - name: Apply production 1.0.13
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply production 1.0.13'

      - name: Apply modern person profile 1.0.14
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply modern person profile 1.0.14'

      - name: Apply professional detailed person report 1.0.15
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply professional detailed person report 1.0.15'

      - name: Apply research intelligence 1.0.16
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply research intelligence 1.0.16'

      - name: Apply web experience architecture 1.1.0
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply web experience architecture 1.1.0'

      - name: Apply route reliability hotfix 1.1.1
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Apply route reliability hotfix 1.1.1'

      - name: Apply family accounts and permissions 1.1.2
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.2\apply-1.1.2.ps1" -Root $env:SOURCE_ROOT

      - name: Apply family contribution portal 1.1.3
        shell: pwsh
        run: |
          $parts = 0..3 | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE ("bootstrap/1.1.3/overlay.part{0:D2}.b64" -f $_) }
          foreach ($part in $parts) { if (-not (Test-Path $part)) { throw "Missing 1.1.3 overlay part: $part" } }
          $encoded = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if ($encoded.Length -ne 34380) { throw "1.1.3 overlay base64 length mismatch: $($encoded.Length)" }
          $zip = Join-Path $env:RUNNER_TEMP 'LoperFamilyTreeBuilder-1.1.3-overlay.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'df66a26835e5a0800e6e4c67f35c3ea4481c5df6be72dce957fe62a7fe0626cc') { throw "1.1.3 overlay hash mismatch: $hash" }
          Expand-Archive $zip -DestinationPath $env:SOURCE_ROOT -Force
          Write-Host '1.1.3 Family Contribution Portal overlay applied.'

      - name: Verify cumulative 1.1.3 contract
        shell: pwsh
        run: |
          $props=Get-Content "$env:SOURCE_ROOT\Directory.Build.props" -Raw
          $launcher=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $policy=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $program=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          $portal=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\FamilyPortal.razor" -Raw
          $submit=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\FamilySubmit.razor" -Raw
          $mine=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\MySubmissions.razor" -Raw
          $review=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\SubmissionReview.razor" -Raw
          $contributors=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\Contributors.razor" -Raw
          $metadata=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Infrastructure\Storage\SubmissionMetadataExtractor.cs" -Raw
          $migration=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Data\Migrations\20260810004500_FamilyContributionPortal.cs" -Raw
          $medical=Get-Content "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\MedicalDashboard.razor" -Raw
          if ($props -notmatch '<Version>1\.1\.3</Version>') { throw 'Application version is not 1.1.3.' }
          if ($launcher -notmatch 'TargetVersion = "1\.1\.3"') { throw 'Pre-upgrade backup target is not 1.1.3.' }
          if ($program -notmatch 'version = "1\.1\.3"' -or $program -notmatch 'family-contribution-portal') { throw '1.1.3 health/version markers missing.' }
          if ($policy -notmatch 'Legacy Number') { throw 'Legacy Number preservation policy missing.' }
          if ($portal -notmatch '@page "/family-portal"' -or $mine -notmatch '@page "/my-submissions"' -or $contributors -notmatch '@page "/contributors"') { throw 'Family portal pages are incomplete.' }
          if ($submit -notmatch 'Provenance' -or $submit -notmatch 'living person' -or $review -notmatch 'Captured file/photo metadata') { throw 'Contribution intake/review workflow is incomplete.' }
          if ($metadata -notmatch 'gpsLatitude' -or $metadata -notmatch 'dateTimeOriginal') { throw 'Photo metadata extraction support is missing.' }
          if ($migration -notmatch 'ContainsLivingPersonInformation' -or $migration -notmatch 'CapturedMetadataJson') { throw '1.1.3 migration is incomplete.' }
          if ($medical -notmatch 'Authorize\(Policy = "MedicalAccess"\)') { throw '1.1.2 medical privacy enforcement was not preserved.' }
          $pagesRoot=Join-Path $env:SOURCE_ROOT 'src/LoperFamilyTreeBuilder.Web/Components/Pages'
          $owners=@{}
          Get-ChildItem $pagesRoot -Filter '*.razor' -File -Recurse | ForEach-Object {
            $text=Get-Content $_.FullName -Raw
            foreach($m in [regex]::Matches($text,'(?m)^@page\s+"([^"]+)"')){
              $route=$m.Groups[1].Value
              if(-not $owners.ContainsKey($route)){$owners[$route]=@()}
              $owners[$route]+=$_.Name
            }
          }
          $dups=@($owners.GetEnumerator() | Where-Object { @($_.Value).Count -gt 1 })
          if($dups.Count -gt 0){ throw 'Duplicate Razor routes detected in 1.1.3.' }
          Write-Host '1.1.3 contract verified: contribution portal, provenance, original-file integrity, metadata, privacy, review workflow, route reliability, and Legacy Number protection.'

      - name: Test and build fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Web build failed.' }
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }

      - name: Publish applications fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Publish applications fail-fast'

      - name: Assemble Windows installer payload
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Assemble Windows installer payload'

      - name: Build WiX 1.1.3 installer fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-112Step.ps1" 'Build WiX 1.1.2 installer fail-fast'

      - name: Create verified 1.1.3 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if (-not (Test-Path $setup)) { throw 'Final 1.1.3 installer missing.' }
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if ($info.ProductVersion -notmatch '^1\.1\.3') { throw "Incorrect ProductVersion: $($info.ProductVersion)" }
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature=Get-AuthenticodeSignature $setup
          [ordered]@{
            application='Loper Family Tree Builder'
            version='1.1.3'
            release='Family Contribution Portal'
            sha256=$hash
            authenticodeStatus=$signature.Status.ToString()
            directUpgradeBaseline='1.0.2'
            upgradeFrom112Verified=$true
            legacyNumberPreservationVerified=$true
            familyAccountsPermissionsPreserved=$true
            routeReliabilityPreserved=$true
            researchIntelligencePreserved=$true
            webExperiencePreserved=$true
            contributionPortalVerified=$true
            mySubmissionsVerified=$true
            contributorHistoryVerified=$true
            provenanceCaptureVerified=$true
            originalFileChecksumVerified=$true
            photoExifDateGpsCaptureVerified=$true
            livingPersonPrivacyFlagVerified=$true
            reviewerApprovalWorkflowVerified=$true
            automaticGenealogyMutationDisabled=$true
            cumulativeTestsPassed=$true
            githubRunId=$env:GITHUB_RUN_ID
            generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.1.3.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "SHA256: $hash"
          Write-Host "Authenticode: $($signature.Status)"

      - name: Upload verified 1.1.3 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.1.3-family-contribution-portal
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.1.3.json
          if-no-files-found: error
