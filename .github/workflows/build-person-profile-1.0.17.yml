name: Build Loper Family Tree Builder 1.0.17

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-person-profile-1.0.17.yml'
      - 'bootstrap/overrides/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-person-profile-1.0.17.yml'
      - 'bootstrap/overrides/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble exact Phase 3 source package
        shell: pwsh
        run: |
          $base64 = ''

          foreach ($part in @(
            'bootstrap/source.part01.b64',
            'bootstrap/source.part02.b64',
            'bootstrap/source.part03.b64',
            'bootstrap/source.part04.b64',
            'bootstrap/source.part05.b64',
            'bootstrap/source.part06.b64'
          )) {
            $base64 += (Get-Content $part -Raw).Trim()
          }

          $base64 += (Get-Content 'bootstrap/source.part07a.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07b.b64' -Raw).Trim()
          $base64 += (Get-Content 'bootstrap/source.part07c.b64' -Raw).Trim()

          $part7d = (Get-Content 'bootstrap/source.part07d.b64' -Raw).Trim()
          if ($part7d.Length -lt 4500) {
            throw 'Source part 7d is incomplete.'
          }
          $base64 += $part7d.Substring(0, 4500)
          $base64 += (Get-Content 'bootstrap/source.part08.b64' -Raw).Trim()

          [IO.File]::WriteAllBytes(
            'phase3.zip',
            [Convert]::FromBase64String($base64)
          )

          $expected = 'eed76fb56a914b1dfba9202053c7f1c3f50a089f1b70f1565157350693ae3cb4'
          $actual = (Get-FileHash phase3.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Reassembled source package failed SHA-256 verification. Expected $expected but received $actual."
          }

          Expand-Archive phase3.zip -DestinationPath source -Force

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set source root
        shell: pwsh
        run: |
          "SOURCE_ROOT=$env:GITHUB_WORKSPACE\source\LoperFamilyTreeBuilder_InstallerFirst_Phase3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply non-blocking folder browser fix
        shell: pwsh
        run: |
          Copy-Item `
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\FirstRunSetupForm.cs" `
            "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\FirstRunSetupForm.cs" `
            -Force

      - name: Apply person profile, audit, and Legacy Number update
        shell: pwsh
        run: |
          $encoded = ''
          foreach ($part in @(
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.part01.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.part02.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.tail01.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.tail02.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.tail03.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.tail04.b64",
            "$env:GITHUB_WORKSPACE\bootstrap\overrides\person-profile-update.tail05.b64"
          )) {
            $encoded += (Get-Content $part -Raw).Trim()
          }

          $scriptPath = Join-Path $env:RUNNER_TEMP 'apply-person-profile-update.ps1'
          [IO.File]::WriteAllBytes(
            $scriptPath,
            [Convert]::FromBase64String($encoded)
          )

          $expectedPatch = '73dd054ca4fae76736be661be238486e2ef1d0d6e3c2da8937aeef25c6d89f59'
          $actualPatch = (Get-FileHash $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPatch -ne $expectedPatch) {
            throw "Person profile patch failed SHA-256 verification. Expected $expectedPatch but received $actualPatch."
          }

          & $scriptPath -SourceRoot $env:SOURCE_ROOT
          if ($LASTEXITCODE -ne 0) {
            throw "Person profile update script failed with exit code $LASTEXITCODE."
          }

      - name: Use WiX 5 installer toolchain
        shell: pwsh
        run: |
          $msiProject = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj"
          $setupProject = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj"

          $msiText = Get-Content $msiProject -Raw
          $msiText = $msiText.Replace('WixToolset.Sdk/7.0.0', 'WixToolset.Sdk/5.0.0')
          Set-Content -Path $msiProject -Value $msiText -Encoding utf8

          $setupText = Get-Content $setupProject -Raw
          $setupText = $setupText.Replace('WixToolset.Sdk/7.0.0', 'WixToolset.Sdk/5.0.0')
          $setupText = $setupText.Replace('WixToolset.Bal.wixext" Version="7.0.0', 'WixToolset.Bal.wixext" Version="5.0.0')
          Set-Content -Path $setupProject -Value $setupText -Encoding utf8

      - name: Set installer version 1.0.17
        shell: pwsh
        run: |
          $packagePath = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\Package.wxs"
          $packageText = Get-Content $packagePath -Raw
          $packageText = $packageText.Replace('Version="1.0.0"', 'Version="1.0.17"')
          $packageText = $packageText.Replace('Root="HKMU"', 'Root="HKCU"')
          Set-Content -Path $packagePath -Value $packageText -Encoding utf8

          $bundlePath = "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs"
          $bundleText = Get-Content $bundlePath -Raw
          $bundleText = $bundleText.Replace('Version="1.0.0.0"', 'Version="1.0.17.0"')
          Set-Content -Path $bundlePath -Value $bundleText -Encoding utf8

      - name: Apply xUnit build compatibility fix
        shell: pwsh
        run: |
          Set-Content `
            -Path "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\GlobalUsings.cs" `
            -Value 'global using Xunit;' `
            -Encoding utf8

      - name: Apply baseline Razor compilation fixes
        shell: pwsh
        run: |
          $importsPath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\_Imports.razor"
          $importsText = Get-Content $importsPath -Raw
          if ($importsText -notmatch 'RenderMode') {
            Add-Content -Path $importsPath -Value '@using static Microsoft.AspNetCore.Components.Web.RenderMode' -Encoding utf8
          }

          $homePath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\Home.razor"
          $homeText = Get-Content $homePath -Raw
          $homeText = $homeText.Replace('@onclick="() => Navigation.NavigateTo("/people/add")"', '@onclick="AddPerson"')
          if ($homeText -notmatch 'private void AddPerson\(\)') {
            $homeMarker = '    private void OpenPeopleSearch()'
            $homeInsert = "    private void AddPerson()`r`n    {`r`n        Navigation.NavigateTo(`"/people/add`");`r`n    }`r`n`r`n    private void OpenPeopleSearch()"
            $homeText = $homeText.Replace($homeMarker, $homeInsert)
          }
          Set-Content -Path $homePath -Value $homeText -Encoding utf8

          $peoplePath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\People.razor"
          $peopleText = Get-Content $peoplePath -Raw
          $peopleText = $peopleText.Replace('@onclick="() => Navigation.NavigateTo("/people/add")"', '@onclick="AddPerson"')
          if ($peopleText -notmatch 'private void AddPerson\(\)') {
            $peopleMarker = '    private static string FormatDate(DateOnly? date)'
            $peopleInsert = "    private void AddPerson()`r`n    {`r`n        Navigation.NavigateTo(`"/people/add`");`r`n    }`r`n`r`n    private static string FormatDate(DateOnly? date)"
            $peopleText = $peopleText.Replace($peopleMarker, $peopleInsert)
          }
          Set-Content -Path $peoplePath -Value $peopleText -Encoding utf8

          $addPath = "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\Components\Pages\AddPerson.razor"
          $addText = Get-Content $addPath -Raw
          $addText = $addText.Replace('@onclick="() => Navigation.NavigateTo("/people")"', '@onclick="Cancel"')
          if ($addText -notmatch 'private void Cancel\(\)') {
            $addMarker = '    private CreatePersonRequest ToRequest()'
            $addInsert = "    private void Cancel()`r`n    {`r`n        Navigation.NavigateTo(`"/people`");`r`n    }`r`n`r`n    private CreatePersonRequest ToRequest()"
            $addText = $addText.Replace($addMarker, $addInsert)
          }
          Set-Content -Path $addPath -Value $addText -Encoding utf8

      - name: Restore tests
        shell: pwsh
        run: |
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"

      - name: Run preservation and editing tests
        shell: pwsh
        run: |
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" `
            -c Release `
            --no-restore

      - name: Compile web application
        shell: pwsh
        run: |
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" `
            -c Release

      - name: Publish web application
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "$env:GITHUB_WORKSPACE\artifacts\publish\Web"

      - name: Publish silent Windows launcher
        shell: pwsh
        run: |
          dotnet publish "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:EnableWindowsTargeting=true `
            -o "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher"

      - name: Assemble installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Web\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app\Web" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\publish\Launcher\*" "$env:GITHUB_WORKSPACE\artifacts\payload\app" -Recurse -Force

      - name: Download Microsoft SQL Server 2022 Express bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          $url = 'https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQL2022-SSEI-Expr.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe"

      - name: Download SQL Server LocalDB installation media
        shell: pwsh
        run: |
          $mediaPath = "$env:GITHUB_WORKSPACE\artifacts\sqlmedia"
          New-Item -ItemType Directory -Force $mediaPath | Out-Null

          $arguments = @(
            '/Action=Download',
            '/MediaType=LocalDB',
            "/MediaPath=$mediaPath",
            '/Quiet'
          )

          $process = Start-Process `
            -FilePath "$env:GITHUB_WORKSPACE\artifacts\SQL2022-SSEI-Expr.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "SQL Server Express media download failed with exit code $($process.ExitCode)."
          }

          $localDb = Get-ChildItem $mediaPath -Filter SqlLocalDB.msi -Recurse | Select-Object -First 1
          if (-not $localDb) {
            throw 'SqlLocalDB.msi was not found in the downloaded Microsoft installation media.'
          }

          Copy-Item $localDb.FullName "$env:GITHUB_WORKSPACE\artifacts\payload\SqlLocalDB.msi" -Force

      - name: Build application MSI
        shell: pwsh
        run: |
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Msi\LoperFamilyTreeBuilder.Msi.wixproj" `
            -c Release `
            -p:InstallerPlatform=x64 `
            -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" `
            -o "$env:GITHUB_WORKSPACE\artifacts\msi"

      - name: Prepare application MSI for bundle
        shell: pwsh
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\msi\LoperFamilyTreeBuilder.msi" `
            "$env:GITHUB_WORKSPACE\artifacts\payload\LoperFamilyTreeBuilder.msi" `
            -Force

      - name: Build single EXE installer
        shell: pwsh
        run: |
          dotnet build "$env:SOURCE_ROOT\installer\LoperFamilyTreeBuilder.Setup\LoperFamilyTreeBuilder.Setup.wixproj" `
            -c Release `
            -p:InstallerPlatform=x64 `
            -p:PayloadDir="$env:GITHUB_WORKSPACE\artifacts\payload" `
            -o "$env:GITHUB_WORKSPACE\artifacts\setup"

      - name: Stage final installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifacts\final" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\artifacts\setup\LoperFamilyTreeBuilderSetup.exe" `
            "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup-1.0.17.exe" `
            -Force
          Get-FileHash "$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup-1.0.17.exe" -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.0.17
          path: artifacts/final/LoperFamilyTreeBuilderSetup-1.0.17.exe
          if-no-files-found: error
