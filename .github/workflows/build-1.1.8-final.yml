name: Build final cumulative 1.1.8

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.1.8-ui-cleanup-archive-separation ]
    paths:
      - '.github/workflows/build-1.1.8-final.yml'
      - 'bootstrap/1.1.8/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify cumulative 1.1.8
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.8\build-1.1.8-final.ps1"
      - name: Upload verified 1.1.8 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.1.8-ui-cleanup-archive-separation
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.1.8.json
          if-no-files-found: error
