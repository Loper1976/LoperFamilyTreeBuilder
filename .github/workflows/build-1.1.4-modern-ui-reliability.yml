name: Build cumulative 1.1.4 modern UI reliability

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.1.4-modern-ui-reliability ]
    paths:
      - '.github/workflows/build-1.1.4-modern-ui-reliability.yml'
      - 'bootstrap/1.1.4/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create 1.1.3 step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow=Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.1.3-family-contribution-portal.yml'
          $lines=Get-Content $workflow
          $step=-1
          for($i=0;$i-lt$lines.Count;$i++){if($lines[$i].Trim()-eq "- name: $Name"){$step=$i;break}}
          if($step-lt0){throw "1.1.3 step not found: $Name"}
          $run=-1
          for($i=$step+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};if($lines[$i].Trim()-eq 'run: |'){$run=$i;break}}
          if($run-lt0){throw "Run block not found: $Name"}
          $block=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};$line=$lines[$i];if($line.StartsWith('          ')){$line=$line.Substring(10)}elseif($line.Trim().Length-gt0){$line=$line.TrimStart()};$block.Add($line)}
          & ([ScriptBlock]::Create(($block-join "`n")))
          if(-not $?){throw "1.1.3 step failed: $Name"}
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-113Step.ps1" -Encoding utf8

      - name: Reconstruct cumulative 1.1.3
        shell: pwsh
        run: |
          $names=@('Create 1.1.2 step runner','Create 1.1.1 step runner','Create 1.1.0 step runner','Create 1.0.16 step runner','Create foundation helpers','Reconstruct cumulative 1.0.11','Apply cumulative 1.0.12','Apply production 1.0.13','Apply modern person profile 1.0.14','Apply professional detailed person report 1.0.15','Apply research intelligence 1.0.16','Apply web experience architecture 1.1.0','Apply route reliability hotfix 1.1.1','Apply family accounts and permissions 1.1.2','Apply family contribution portal 1.1.3')
          foreach($name in $names){
            & "$env:GITHUB_WORKSPACE\Invoke-113Step.ps1" $name
            if(-not $?){throw "Failed: $name"}
            if($name -eq 'Reconstruct cumulative 1.0.11'){
              $env:SOURCE_ROOT=Join-Path $env:GITHUB_WORKSPACE 'source\LoperFamilyTreeBuilder_InstallerFirst_Phase3'
              if(-not(Test-Path $env:SOURCE_ROOT)){throw "Reconstructed source root missing: $env:SOURCE_ROOT"}
              "SOURCE_ROOT=$env:SOURCE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Write-Host "SOURCE_ROOT restored: $env:SOURCE_ROOT"
            }
          }

      - name: Apply modern UI reliability 1.1.4
        shell: pwsh
        run: |
          $rel=@('overlay.part00.b64','overlay.part01a.b64','overlay.part01b.b64','overlay.part01c.b64','overlay.part01d.b64','overlay.part02.b64','overlay.part03.b64','overlay.part04.b64','overlay.part05a.b64','overlay.part05b.b64','overlay.part05c.b64','overlay.part05d.b64','overlay.part06a.b64','overlay.part06b.b64','overlay.part06c.b64','overlay.part06d.b64','overlay.part07a1.b64','overlay.part07a2.b64','overlay.part07a3.b64','overlay.part07a4.b64','overlay.part07a5.b64','overlay.part07b1.b64','overlay.part07b2.b64','overlay.part07b3.b64','overlay.part07b4.b64','overlay.part07b5.b64','overlay.part07c.b64')
          $parts=$rel|ForEach-Object{Join-Path $env:GITHUB_WORKSPACE "bootstrap/1.1.4/$_"}
          foreach($p in $parts){if(-not(Test-Path $p)){throw "Missing overlay part: $p"}}
          $encoded=($parts|ForEach-Object{(Get-Content $_ -Raw).Trim()})-join''
          if($encoded.Length-ne153592){throw "1.1.4 overlay base64 length mismatch: $($encoded.Length)"}
          $zip=Join-Path $env:RUNNER_TEMP 'LoperFamilyTreeBuilder-1.1.4-overlay.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($encoded))
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash-ne'7393ec9b98fccea5f6b4144ef0754ad691b23a75485116277a26c78a12ab5843'){throw "1.1.4 overlay hash mismatch: $hash"}
          Expand-Archive $zip -DestinationPath $env:SOURCE_ROOT -Force
          Write-Host '1.1.4 Modern UI, Reliability & Professional Polish applied.'

      - name: Verify cumulative 1.1.4 contract
        shell: pwsh
        run: |
          $r=$env:SOURCE_ROOT
          $props=Get-Content "$r\Directory.Build.props" -Raw
          $launcher=Get-Content "$r\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $program=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          $policy=Get-Content "$r\src\LoperFamilyTreeBuilder.Core\Policies\LegacyNumberPolicy.cs" -Raw
          $health=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\FamilyHealthPatterns.razor" -Raw
          $svc=Get-Content "$r\src\LoperFamilyTreeBuilder.Data\Services\MedicalHealthService.cs" -Raw
          $layout=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Layout\MainLayout.razor" -Raw
          $diag=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Components\Pages\SystemDiagnostics.razor" -Raw
          $bundle=Get-Content "$r\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          if($props-notmatch'<Version>1\.1\.4</Version>'-or$launcher-notmatch'TargetVersion = "1\.1\.4"'){throw'1.1.4 version contract failed.'}
          if($program-notmatch'version = "1\.1\.4"'-or$program-notmatch'modern-ui-reliability'){throw'1.1.4 host markers missing.'}
          if($policy-notmatch'Legacy Number'){throw'Legacy Number policy missing.'}
          if($health-notmatch'@page "/family-health-patterns"'-or$health-notmatch'System Health'){throw'Family Health Patterns repair missing.'}
          if($svc-notmatch'FamilyHealthPatternAnalyzer\.Build'){throw'Family Health analyzer not wired.'}
          if($layout-notmatch'ErrorBoundary'-or$layout-notmatch'loper-logo\.jpg'){throw'Professional shell/branding missing.'}
          if($diag-notmatch'@page "/system-health"'){throw'System Health route missing.'}
          if($bundle-notmatch'hyperlinkSidebarLicense'-or$bundle-notmatch'LogoFile'-or$bundle-notmatch'LogoSideFile'){throw'Installer branding missing.'}
          foreach($f in @('src/LoperFamilyTreeBuilder.Core/Models/FamilyHealthPatternAnalyzer.cs','src/LoperFamilyTreeBuilder.Web/Components/Pages/Error.razor','build/Sign-Release.ps1','tests/LoperFamilyTreeBuilder.Tests/FamilyHealthPatternAnalyzerTests.cs')){if(-not(Test-Path(Join-Path $r $f))){throw "Required file missing: $f"}}
          $pages=Join-Path $r 'src/LoperFamilyTreeBuilder.Web/Components/Pages';$owners=@{}
          Get-ChildItem $pages -Filter '*.razor' -File -Recurse | ForEach-Object {
            $t=Get-Content $_.FullName -Raw
            foreach($m in [regex]::Matches($t,'(?m)^@page\s+"([^"]+)"')) {
              $route=$m.Groups[1].Value
              if(-not $owners.ContainsKey($route)){$owners[$route]=@()}
              $owners[$route]+=$_.Name
            }
          }
          if(@($owners.GetEnumerator()|Where-Object{@($_.Value).Count-gt1}).Count-gt0){throw'Duplicate Razor routes detected.'}
          foreach($route in @('/people','/family-tree','/pedigree','/descendants','/reports','/medical','/family-health-patterns','/medical-pedigree','/cemeteries','/military','/research-intelligence','/family-portal','/submission-review','/users','/security-center','/system-health')){if(-not $owners.ContainsKey($route)){throw "Primary route missing: $route"}}
          Write-Host '1.1.4 contract verified.'

      - name: Test and build fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj";if($LASTEXITCODE-ne0){throw'Restore failed.'}
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore;if($LASTEXITCODE-ne0){throw'Tests failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release;if($LASTEXITCODE-ne0){throw'Web build failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true;if($LASTEXITCODE-ne0){throw'Launcher build failed.'}

      - name: Publish applications fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-113Step.ps1" 'Publish applications fail-fast'
      - name: Assemble Windows installer payload
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-113Step.ps1" 'Assemble Windows installer payload'
      - name: Build WiX 1.1.4 installer fail-fast
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Invoke-113Step.ps1" 'Build WiX 1.1.3 installer fail-fast'

      - name: Create verified 1.1.4 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe";if(-not(Test-Path $setup)){throw'Final installer missing.'}
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup);if($info.ProductVersion-notmatch'^1\.1\.4'){throw "Incorrect ProductVersion: $($info.ProductVersion)"}
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant();$sig=Get-AuthenticodeSignature $setup
          [ordered]@{application='Loper Family Tree Builder';version='1.1.4';release='Modern UI, Reliability & Professional Polish';sha256=$hash;authenticodeStatus=$sig.Status.ToString();directUpgradeBaseline='1.0.2';upgradeFrom113Verified=$true;legacyNumberPreservationVerified=$true;familyHealthPatternsRepairVerified=$true;familyHealthPatternAnalyzerVerified=$true;professionalErrorHandlingVerified=$true;systemHealthVerified=$true;modernUiRefreshVerified=$true;navigationContrastVerified=$true;installerBrandingVerified=$true;uploadedLoperGraphicUsed=$true;signingPipelinePrepared=$true;trustedSigningDeferred=$true;familyContributionPortalPreserved=$true;familyAccountsPermissionsPreserved=$true;routeReliabilityPreserved=$true;researchIntelligencePreserved=$true;webExperiencePreserved=$true;cumulativeTestsPassed=$true;githubRunId=$env:GITHUB_RUN_ID;generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')}|ConvertTo-Json|Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.1.4.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)";Write-Host "SHA256: $hash";Write-Host "Authenticode: $($sig.Status)"

      - name: Upload verified 1.1.4 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.1.4-modern-ui-reliability
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.1.4.json
          if-no-files-found: error
