name: Build cumulative 1.2.3.1 installer hotfix

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.2.3.1-installer-logo-hotfix ]
    paths:
      - '.github/workflows/build-1.2.3.1-installer-hotfix.yml'
      - 'bootstrap/1.2.3.1/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create installer step runner
        shell: pwsh
        run: |
          @'
          param([Parameter(Mandatory=$true)][string]$Name)
          $workflow=Join-Path $env:GITHUB_WORKSPACE '.github/workflows/build-1.1.4.1-ui-reliability-hotfix.yml'
          if(-not(Test-Path $workflow)){throw "Installer workflow missing: $workflow"}
          $lines=Get-Content $workflow;$step=-1
          for($i=0;$i-lt$lines.Count;$i++){if($lines[$i].Trim()-eq "- name: $Name"){$step=$i;break}}
          if($step-lt0){throw "Installer step not found: $Name"};$run=-1
          for($i=$step+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};if($lines[$i].Trim()-eq 'run: |'){$run=$i;break}}
          if($run-lt0){throw "Run block not found: $Name"};$block=New-Object System.Collections.Generic.List[string]
          for($i=$run+1;$i-lt$lines.Count;$i++){if($lines[$i]-match '^      - '){break};$line=$lines[$i];if($line.StartsWith('          ')){$line=$line.Substring(10)}elseif($line.Trim().Length-gt0){$line=$line.TrimStart()};$block.Add($line)}
          & ([ScriptBlock]::Create(($block-join "`n")));if(-not $?){throw "Installer step failed: $Name"}
          '@ | Set-Content "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" -Encoding utf8

      - name: Reconstruct verified cumulative 1.2.3
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.8\build-1.1.8-final.ps1"
          $env:SOURCE_ROOT=Join-Path $env:GITHUB_WORKSPACE 'source\LoperFamilyTreeBuilder_InstallerFirst_Phase3'
          if(-not(Test-Path $env:SOURCE_ROOT)){throw "1.1.8 source missing: $env:SOURCE_ROOT"}
          "SOURCE_ROOT=$env:SOURCE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.9\apply-1.1.9.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.0\apply-1.2.0.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.1\apply-1.2.1.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.2\apply-1.2.2.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.3\apply-1.2.3.ps1" -Root $env:SOURCE_ROOT
          Write-Host 'Verified cumulative 1.2.3 source reconstructed.'

      - name: Apply 1.2.3.1 installer hotfix
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.3.1\apply-1.2.3.1.ps1" -Root $env:SOURCE_ROOT

      - name: Verify 1.2.3.1 installer contract
        shell: pwsh
        run: |
          $r=$env:SOURCE_ROOT
          $props=Get-Content "$r\Directory.Build.props" -Raw
          $launcher=Get-Content "$r\src\LoperFamilyTreeBuilder.Launcher\UpgradeBackupService.cs" -Raw
          $program=Get-Content "$r\src\LoperFamilyTreeBuilder.Web\Program.cs" -Raw
          $bundle=Get-Content "$r\installer\LoperFamilyTreeBuilder.Setup\Bundle.wxs" -Raw
          $png="$r\src\LoperFamilyTreeBuilder.Web\wwwroot\images\loper-installer-logo.png"
          $jpg="$r\src\LoperFamilyTreeBuilder.Web\wwwroot\images\loper-logo.jpg"
          if($props-notmatch'<Version>1\.2\.3</Version>'-or$props-notmatch'<FileVersion>1\.2\.3\.1</FileVersion>'-or$props-notmatch'1\.2\.3\.1-installer-logo-hotfix'){throw '1.2.3.1 file metadata missing.'}
          if($launcher-notmatch'TargetVersion = "1\.2\.3\.1"'){throw '1.2.3.1 upgrade backup target missing.'}
          if($program-notmatch'version = "1\.2\.3\.1"'-or$program-notmatch'release = "installer-logo-hotfix"'){throw '1.2.3.1 host markers missing.'}
          if(-not(Test-Path $jpg)){throw 'Official LOPER Texas application logo missing.'}
          if(-not(Test-Path $png)){throw 'Installer PNG logo missing.'}
          Add-Type -AssemblyName System.Drawing
          $appImage=[System.Drawing.Image]::FromFile($jpg)
          try{if($appImage.Width-lt1-or$appImage.Height-lt1){throw 'Application logo could not be decoded.'}}finally{$appImage.Dispose()}
          $installerImage=[System.Drawing.Image]::FromFile($png)
          try{if($installerImage.Width-ne64-or$installerImage.Height-ne64){throw "Installer PNG dimensions are $($installerImage.Width)x$($installerImage.Height)."}}finally{$installerImage.Dispose()}
          $bytes=[IO.File]::ReadAllBytes($png)
          if($bytes[0]-ne0x89-or$bytes[1]-ne0x50-or$bytes[2]-ne0x4E-or$bytes[3]-ne0x47){throw 'Installer logo does not have a PNG signature.'}
          if($bundle-notmatch'Version="1\.2\.3\.1"'){throw 'Bundle version is not 1.2.3.1.'}
          if($bundle-notmatch'Theme="hyperlinkLicense"'){throw 'Simple WixStdBA theme is not enabled.'}
          if($bundle-notmatch'LogoFile="[^"]*loper-installer-logo\.png"'){throw 'Bundle is not using the generated PNG logo.'}
          if($bundle-match'LogoSideFile='){throw 'Sidebar logo must not be used.'}
          foreach($f in @('src/LoperFamilyTreeBuilder.Data/Services/TreeIntegrityService.cs','src/LoperFamilyTreeBuilder.Web/Components/Pages/DataQuality.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/Messages.razor','src/LoperFamilyTreeBuilder.Web/Components/Pages/MediaMigration.razor')){if(-not(Test-Path(Join-Path $r $f))){throw "Cumulative feature missing: $f"}}
          Write-Host '1.2.3.1 installer contract verified, including real image decode and 64x64 PNG validation.'

      - name: Test and build cumulative 1.2.3.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj"
          if($LASTEXITCODE-ne0){throw 'Restore failed.'}
          dotnet test "$env:SOURCE_ROOT\tests\LoperFamilyTreeBuilder.Tests\LoperFamilyTreeBuilder.Tests.csproj" -c Release --no-restore
          if($LASTEXITCODE-ne0){throw 'Tests failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Web\LoperFamilyTreeBuilder.Web.csproj" -c Release
          if($LASTEXITCODE-ne0){throw 'Web build failed.'}
          dotnet build "$env:SOURCE_ROOT\src\LoperFamilyTreeBuilder.Launcher\LoperFamilyTreeBuilder.Launcher.csproj" -c Release -p:EnableWindowsTargeting=true
          if($LASTEXITCODE-ne0){throw 'Launcher build failed.'}

      - name: Publish 1.2.3.1 applications
        shell: pwsh
        run: |
          if(Test-Path "$env:GITHUB_WORKSPACE\artifacts"){Remove-Item "$env:GITHUB_WORKSPACE\artifacts" -Recurse -Force}
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Publish applications fail-fast'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Assemble Windows installer payload'
          & "$env:GITHUB_WORKSPACE\Invoke-InstallerStep.ps1" 'Build WiX 1.1.4.1 installer fail-fast'

      - name: Smoke test finished EXE on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          if(-not(Test-Path $setup)){throw 'Hotfix installer is missing.'}
          $log=Join-Path $env:RUNNER_TEMP 'LoperFamilyTreeBuilder-1.2.3.1-smoke.log'
          $args="-quiet -norestart -l `"$log`""
          $process=Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010){
            if(Test-Path $log){Get-Content $log -Tail 200}
            throw "Installer smoke test failed with exit code $($process.ExitCode)."
          }
          if(-not(Test-Path $log)){throw 'Burn smoke-test log was not created.'}
          $logText=Get-Content $log -Raw
          if($logText-notmatch'Loper Family Tree Builder'){throw 'Burn log does not identify the Loper Family Tree Builder bundle.'}
          Write-Host "Installer smoke test passed with exit code $($process.ExitCode)."
          $uninstall=Start-Process -FilePath $setup -ArgumentList '-uninstall -quiet -norestart' -Wait -PassThru
          if($uninstall.ExitCode -ne 0 -and $uninstall.ExitCode -ne 3010){throw "Smoke-test uninstall failed with exit code $($uninstall.ExitCode)."}

      - name: Create verified 1.2.3.1 release manifest
        shell: pwsh
        run: |
          $setup="$env:GITHUB_WORKSPACE\artifacts\final\LoperFamilyTreeBuilderSetup.exe"
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($setup)
          if($info.ProductVersion-notmatch'^1\.2\.3\.1'){throw "Incorrect ProductVersion: $($info.ProductVersion)"}
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant();$sig=Get-AuthenticodeSignature $setup
          [ordered]@{application='Loper Family Tree Builder';version='1.2.3.1';release='Installer Logo Reliability Hotfix';sha256=$hash;authenticodeStatus=$sig.Status.ToString();upgradeFrom123Verified=$true;installerSmokeTestVerified=$true;wixStdBALogoPngVerified=$true;installerLogoDecodedInCi=$true;simpleWixStdBAThemeVerified=$true;officialLoperTexasLogoPreserved=$true;treeErrorCheckerPreserved=$true;dataQualityCenterPreserved=$true;legacyNumberPreservationVerified=$true;familyMessagingPreserved=$true;mediaMigrationPreserved=$true;hudThemePreserved=$true;gedcomImportReadinessPreserved=$true;trustedSigningDeferred=$true;cumulativeTestsPassed=$true;githubRunId=$env:GITHUB_RUN_ID;generatedUtc=[DateTimeOffset]::UtcNow.ToString('O')}|ConvertTo-Json|Set-Content "$env:GITHUB_WORKSPACE\artifacts\final\release-manifest-1.2.3.1.json" -Encoding utf8
          Write-Host "ProductVersion: $($info.ProductVersion)";Write-Host "SHA256: $hash";Write-Host "Authenticode: $($sig.Status)"

      - name: Upload verified 1.2.3.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilderSetup-1.2.3.1-installer-hotfix
          path: |
            artifacts/final/LoperFamilyTreeBuilderSetup.exe
            artifacts/final/release-manifest-1.2.3.1.json
          if-no-files-found: error
