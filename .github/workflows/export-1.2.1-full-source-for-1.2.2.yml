name: Export reconstructed 1.2.1 source for 1.2.2

on:
  workflow_dispatch:
  push:
    branches: [ cumulative-1.2.2-ancestry-ftm-media-migration ]
    paths:
      - '.github/workflows/export-1.2.1-full-source-for-1.2.2.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reconstruct verified cumulative 1.2.1
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.8\build-1.1.8-final.ps1"
          $env:SOURCE_ROOT=Join-Path $env:GITHUB_WORKSPACE 'source\LoperFamilyTreeBuilder_InstallerFirst_Phase3'
          if(-not(Test-Path $env:SOURCE_ROOT)){throw "1.1.8 source missing: $env:SOURCE_ROOT"}
          & "$env:GITHUB_WORKSPACE\bootstrap\1.1.9\apply-1.1.9.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.0\apply-1.2.0.ps1" -Root $env:SOURCE_ROOT
          & "$env:GITHUB_WORKSPACE\bootstrap\1.2.1\apply-1.2.1.ps1" -Root $env:SOURCE_ROOT
          Write-Host 'Verified cumulative 1.2.1 source reconstructed.'
      - name: Remove build output
        shell: pwsh
        run: |
          Get-ChildItem $env:SOURCE_ROOT -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          if(Test-Path "$env:GITHUB_WORKSPACE\artifacts"){Remove-Item "$env:GITHUB_WORKSPACE\artifacts" -Recurse -Force}
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: LoperFamilyTreeBuilder-1.2.1-full-source-for-1.2.2
          path: source/LoperFamilyTreeBuilder_InstallerFirst_Phase3
          if-no-files-found: error
